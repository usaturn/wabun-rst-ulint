[project]
name = "wabun-rst-ulint"
version = "0.0.0"
description = "reStructuredText の検査・修正 CLI ツール"
readme = "README.rst"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "usaturn" }]
dependencies = [
    "docutils>=0.22,<0.23",
]

[project.urls]
Homepage = "https://github.com/usaturn/wabun-rst-ulint"

[project.scripts]
wabun-rst-ulint = "wabun_rst_ulint.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "taskipy>=1.14.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
# Allow `import tests.inline_corpus` / `import tests.helpers` for S1 corpus modules.
pythonpath = ["."]
# public サブモジュール内のミラー(public/tests 等)を収集対象から除外する。
# 公開側には tools が存在しないが、存在しない testpaths エントリは無視される。
testpaths = ["tests", "tools/public_sync/tests"]


[tool.ruff]
target-version = "py314"
exclude = [
    ".venv",
    ".ruff_cache"
]
line-length = 119

[tool.ruff.lint]
select = [
    "F", # Flake8
    "B", # Black
    "I", # isort
    "E", # error
    "W"  # warning
]
ignore = []
fixable = ["ALL"]

# インポートの整理
[tool.ruff.lint.isort]
known-first-party = ["wabun_rst_ulint"]

# 自動フォーマット設定
[tool.ruff.format]
line-ending = "auto"

[tool.taskipy.tasks]
ruff = "uvx ruff check --fix --unsafe-fixes src tests tools && uvx ruff format src tests tools"
